services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  mcp-server:
    build: .
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      - MCPRAG_QDRANT_MODE=server
      - MCPRAG_QDRANT_URL=http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    # Note: For MCP clients (Claude Desktop, Cursor), you'll typically
    # run the Python server locally since they spawn it via stdio.
    # This compose file is mainly useful for running Qdrant easily.

volumes:
  qdrant_storage:
